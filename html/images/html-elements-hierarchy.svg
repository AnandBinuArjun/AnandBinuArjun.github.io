<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      fill: #3c3c3c;
      stroke: #007acc;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .node-text {
      fill: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .arrow {
      stroke: #007acc;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .arrow-text {
      fill: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      text-anchor: middle;
    }
    .text-node {
      fill: #2d2d2d;
      stroke: #4ec9b0;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .media-node {
      fill: #2d2d2d;
      stroke: #d16969;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .form-node {
      fill: #2d2d2d;
      stroke: #c586c0;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .table-node {
      fill: #2d2d2d;
      stroke: #d7ba7d;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007acc" />
    </marker>
  </defs>
  
  <!-- Root Element -->
  <rect x="400" y="30" width="150" height="50" class="node" />
  <text x="475" y="55" class="node-text">HTML Elements</text>
  
  <!-- Main Categories -->
  <rect x="150" y="120" width="150" height="50" class="text-node" />
  <text x="225" y="145" class="node-text">Text Elements</text>
  
  <rect x="350" y="120" width="150" height="50" class="media-node" />
  <text x="425" y="145" class="node-text">Media Elements</text>
  
  <rect x="550" y="120" width="150" height="50" class="form-node" />
  <text x="625" y="145" class="node-text">Form Elements</text>
  
  <rect x="750" y="120" width="150" height="50" class="table-node" />
  <text x="825" y="145" class="node-text">Table Elements</text>
  
  <!-- Text Elements -->
  <rect x="50" y="220" width="120" height="40" class="node" />
  <text x="110" y="240" class="node-text">&lt;h1&gt;-&lt;h6&gt;</text>
  
  <rect x="190" y="220" width="120" height="40" class="node" />
  <text x="250" y="240" class="node-text">&lt;p&gt;</text>
  
  <rect x="330" y="220" width="120" height="40" class="node" />
  <text x="390" y="240" class="node-text">&lt;span&gt;</text>
  
  <!-- Media Elements -->
  <rect x="470" y="220" width="120" height="40" class="node" />
  <text x="530" y="240" class="node-text">&lt;img&gt;</text>
  
  <rect x="610" y="220" width="120" height="40" class="node" />
  <text x="670" y="240" class="node-text">&lt;video&gt;</text>
  
  <rect x="750" y="220" width="120" height="40" class="node" />
  <text x="810" y="240" class="node-text">&lt;audio&gt;</text>
  
  <!-- Form Elements -->
  <rect x="250" y="320" width="120" height="40" class="node" />
  <text x="310" y="340" class="node-text">&lt;form&gt;</text>
  
  <rect x="390" y="320" width="120" height="40" class="node" />
  <text x="450" y="340" class="node-text">&lt;input&gt;</text>
  
  <rect x="530" y="320" width="120" height="40" class="node" />
  <text x="590" y="340" class="node-text">&lt;textarea&gt;</text>
  
  <rect x="670" y="320" width="120" height="40" class="node" />
  <text x="730" y="340" class="node-text">&lt;button&gt;</text>
  
  <!-- Table Elements -->
  <rect x="250" y="420" width="120" height="40" class="node" />
  <text x="310" y="440" class="node-text">&lt;table&gt;</text>
  
  <rect x="390" y="420" width="120" height="40" class="node" />
  <text x="450" y="440" class="node-text">&lt;tr&gt;</text>
  
  <rect x="530" y="420" width="120" height="40" class="node" />
  <text x="590" y="440" class="node-text">&lt;td&gt;</text>
  
  <rect x="670" y="420" width="120" height="40" class="node" />
  <text x="730" y="440" class="node-text">&lt;th&gt;</text>
  
  <!-- Semantic Elements -->
  <rect x="150" y="520" width="150" height="50" class="node" />
  <text x="225" y="545" class="node-text">Semantic Elements</text>
  
  <rect x="50" y="600" width="120" height="40" class="node" />
  <text x="110" y="620" class="node-text">&lt;header&gt;</text>
  
  <rect x="190" y="600" width="120" height="40" class="node" />
  <text x="250" y="620" class="node-text">&lt;nav&gt;</text>
  
  <rect x="330" y="600" width="120" height="40" class="node" />
  <text x="390" y="620" class="node-text">&lt;main&gt;</text>
  
  <rect x="470" y="600" width="120" height="40" class="node" />
  <text x="530" y="620" class="node-text">&lt;article&gt;</text>
  
  <rect x="610" y="600" width="120" height="40" class="node" />
  <text x="670" y="620" class="node-text">&lt;section&gt;</text>
  
  <rect x="750" y="600" width="120" height="40" class="node" />
  <text x="810" y="620" class="node-text">&lt;footer&gt;</text>
  
  <!-- Arrows -->
  <line x1="475" y1="80" x2="225" y2="120" class="arrow" />
  <line x1="475" y1="80" x2="425" y2="120" class="arrow" />
  <line x1="475" y1="80" x2="625" y2="120" class="arrow" />
  <line x1="475" y1="80" x2="825" y2="120" class="arrow" />
  
  <line x1="225" y1="170" x2="110" y2="220" class="arrow" />
  <line x1="225" y1="170" x2="250" y2="220" class="arrow" />
  <line x1="225" y1="170" x2="390" y2="220" class="arrow" />
  
  <line x1="425" y1="170" x2="530" y2="220" class="arrow" />
  <line x1="425" y1="170" x2="670" y2="220" class="arrow" />
  <line x1="425" y1="170" x2="810" y2="220" class="arrow" />
  
  <line x1="625" y1="170" x2="310" y2="320" class="arrow" />
  <line x1="625" y1="170" x2="450" y2="320" class="arrow" />
  <line x1="625" y1="170" x2="590" y2="320" class="arrow" />
  <line x1="625" y1="170" x2="730" y2="320" class="arrow" />
  
  <line x1="825" y1="170" x2="310" y2="420" class="arrow" />
  <line x1="825" y1="170" x2="450" y2="420" class="arrow" />
  <line x1="825" y1="170" x2="590" y2="420" class="arrow" />
  <line x1="825" y1="170" x2="730" y2="420" class="arrow" />
  
  <line x1="475" y1="360" x2="225" y2="520" class="arrow" />
  
  <line x1="225" y1="570" x2="110" y2="600" class="arrow" />
  <line x1="225" y1="570" x2="250" y2="600" class="arrow" />
  <line x1="225" y1="570" x2="390" y2="600" class="arrow" />
  <line x1="225" y1="570" x2="530" y2="600" class="arrow" />
  <line x1="225" y1="570" x2="670" y2="600" class="arrow" />
  <line x1="225" y1="570" x2="810" y2="600" class="arrow" />
  
  <!-- Labels -->
  <text x="110" y="240" class="arrow-text">Headings</text>
  <text x="530" y="240" class="arrow-text">Images</text>
  <text x="310" y="340" class="arrow-text">Forms</text>
  <text x="310" y="440" class="arrow-text">Tables</text>
  <text x="110" y="620" class="arrow-text">Header</text>
</svg>