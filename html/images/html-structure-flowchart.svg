<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      fill: #3c3c3c;
      stroke: #007acc;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .node-text {
      fill: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .arrow {
      stroke: #007acc;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .arrow-text {
      fill: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      text-anchor: middle;
    }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007acc" />
    </marker>
  </defs>
  
  <!-- Nodes -->
  <rect x="300" y="50" width="200" height="50" class="node" />
  <text x="400" y="75" class="node-text">&lt;!DOCTYPE html&gt;</text>
  
  <rect x="300" y="130" width="200" height="50" class="node" />
  <text x="400" y="155" class="node-text">&lt;html&gt;</text>
  
  <rect x="150" y="210" width="200" height="50" class="node" />
  <text x="250" y="235" class="node-text">&lt;head&gt;</text>
  
  <rect x="450" y="210" width="200" height="50" class="node" />
  <text x="550" y="235" class="node-text">&lt;body&gt;</text>
  
  <rect x="50" y="290" width="150" height="40" class="node" />
  <text x="125" y="310" class="node-text">&lt;title&gt;</text>
  
  <rect x="225" y="290" width="150" height="40" class="node" />
  <text x="300" y="310" class="node-text">&lt;meta&gt;</text>
  
  <rect x="400" y="290" width="150" height="40" class="node" />
  <text x="475" y="310" class="node-text">&lt;h1&gt;</text>
  
  <rect x="575" y="290" width="150" height="40" class="node" />
  <text x="650" y="310" class="node-text">&lt;p&gt;</text>
  
  <rect x="150" y="370" width="200" height="50" class="node" />
  <text x="250" y="395" class="node-text">&lt;/head&gt;</text>
  
  <rect x="450" y="370" width="200" height="50" class="node" />
  <text x="550" y="395" class="node-text">&lt;/body&gt;</text>
  
  <rect x="300" y="450" width="200" height="50" class="node" />
  <text x="400" y="475" class="node-text">&lt;/html&gt;</text>
  
  <!-- Arrows -->
  <line x1="400" y1="100" x2="400" y2="130" class="arrow" />
  
  <line x1="400" y1="180" x2="250" y2="210" class="arrow" />
  <line x1="400" y1="180" x2="550" y2="210" class="arrow" />
  
  <line x1="250" y1="260" x2="125" y2="290" class="arrow" />
  <line x1="250" y1="260" x2="300" y2="290" class="arrow" />
  
  <line x1="550" y1="260" x2="475" y2="290" class="arrow" />
  <line x1="550" y1="260" x2="650" y2="290" class="arrow" />
  
  <line x1="125" y1="330" x2="250" y2="370" class="arrow" />
  <line x1="300" y1="330" x2="250" y2="370" class="arrow" />
  
  <line x1="475" y1="330" x2="550" y2="370" class="arrow" />
  <line x1="650" y1="330" x2="550" y2="370" class="arrow" />
  
  <line x1="250" y1="420" x2="400" y2="450" class="arrow" />
  <line x1="550" y1="420" x2="400" y2="450" class="arrow" />
  
  <!-- Labels -->
  <text x="300" y="155" class="arrow-text">Root Element</text>
  <text x="150" y="235" class="arrow-text">Document Head</text>
  <text x="600" y="235" class="arrow-text">Document Body</text>
</svg>