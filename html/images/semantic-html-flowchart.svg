<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      fill: #3c3c3c;
      stroke: #007acc;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .node-text {
      fill: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .arrow {
      stroke: #007acc;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .arrow-text {
      fill: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      text-anchor: middle;
    }
    .section-node {
      fill: #2d2d2d;
      stroke: #4ec9b0;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007acc" />
    </marker>
  </defs>
  
  <!-- Main Structure -->
  <rect x="350" y="50" width="200" height="50" class="node" />
  <text x="450" y="75" class="node-text">&lt;html&gt;</text>
  
  <rect x="200" y="130" width="200" height="50" class="node" />
  <text x="300" y="155" class="node-text">&lt;head&gt;</text>
  
  <rect x="500" y="130" width="200" height="50" class="node" />
  <text x="600" y="155" class="node-text">&lt;body&gt;</text>
  
  <!-- Header Section -->
  <rect x="550" y="210" width="200" height="50" class="section-node" />
  <text x="650" y="235" class="node-text">&lt;header&gt;</text>
  
  <rect x="550" y="280" width="150" height="40" class="node" />
  <text x="625" y="300" class="node-text">&lt;h1&gt;Site Title&lt;/h1&gt;</text>
  
  <rect x="550" y="330" width="150" height="40" class="node" />
  <text x="625" y="350" class="node-text">&lt;nav&gt;&lt;/nav&gt;</text>
  
  <!-- Main Content Section -->
  <rect x="200" y="400" width="200" height="50" class="section-node" />
  <text x="300" y="425" class="node-text">&lt;main&gt;</text>
  
  <rect x="200" y="470" width="150" height="40" class="node" />
  <text x="275" y="490" class="node-text">&lt;article&gt;</text>
  
  <rect x="200" y="520" width="150" height="40" class="node" />
  <text x="275" y="540" class="node-text">&lt;section&gt;</text>
  
  <!-- Sidebar Section -->
  <rect x="550" y="400" width="200" height="50" class="section-node" />
  <text x="650" y="425" class="node-text">&lt;aside&gt;</text>
  
  <rect x="550" y="470" width="150" height="40" class="node" />
  <text x="625" y="490" class="node-text">&lt;h2&gt;Sidebar&lt;/h2&gt;</text>
  
  <!-- Footer Section -->
  <rect x="350" y="570" width="200" height="50" class="section-node" />
  <text x="450" y="595" class="node-text">&lt;footer&gt;</text>
  
  <rect x="350" y="640" width="200" height="40" class="node" />
  <text x="450" y="660" class="node-text">&lt;p&gt;Copyright Info&lt;/p&gt;</text>
  
  <!-- Arrows -->
  <line x1="450" y1="100" x2="300" y2="130" class="arrow" />
  <line x1="450" y1="100" x2="600" y2="130" class="arrow" />
  
  <line x1="600" y1="180" x2="650" y2="210" class="arrow" />
  
  <line x1="650" y1="260" x2="625" y2="280" class="arrow" />
  <line x1="650" y1="260" x2="625" y2="330" class="arrow" />
  
  <line x1="300" y1="180" x2="300" y2="400" class="arrow" />
  <line x1="600" y1="180" x2="300" y2="400" class="arrow" />
  
  <line x1="300" y1="510" x2="275" y2="520" class="arrow" />
  
  <line x1="600" y1="180" x2="650" y2="400" class="arrow" />
  
  <line x1="300" y1="560" x2="450" y2="570" class="arrow" />
  <line x1="650" y1="450" x2="450" y2="570" class="arrow" />
  
  <line x1="450" y1="620" x2="450" y2="640" class="arrow" />
  
  <!-- Labels -->
  <text x="200" y="155" class="arrow-text">Document Metadata</text>
  <text x="700" y="155" class="arrow-text">Page Content</text>
  <text x="750" y="235" class="arrow-text">Page Header</text>
  <text x="300" y="425" class="arrow-text">Main Content</text>
  <text x="750" y="425" class="arrow-text">Sidebar</text>
  <text x="450" y="595" class="arrow-text">Page Footer</text>
</svg>