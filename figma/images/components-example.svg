<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fa" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Main component -->
  <rect x="50" y="50" width="120" height="40" rx="6" fill="#4299e1" opacity="0.9"/>
  <text x="110" y="75" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Main Component</text>
  
  <!-- Instances -->
  <rect x="200" y="50" width="120" height="40" rx="6" fill="#4299e1" opacity="0.7"/>
  <text x="260" y="75" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Instance 1</text>
  
  <rect x="50" y="120" width="120" height="40" rx="6" fill="#4299e1" opacity="0.7"/>
  <text x="110" y="145" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Instance 2</text>
  
  <rect x="200" y="120" width="120" height="40" rx="6" fill="#4299e1" opacity="0.7"/>
  <text x="260" y="145" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Instance 3</text>
  
  <!-- Connection arrows -->
  <line x1="170" y1="70" x2="200" y2="70" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="90" x2="50" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="90" x2="200" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- Labels -->
  <text x="200" y="30" font-family="Arial" font-size="16" fill="#2d3748" text-anchor="middle">Component System</text>
  <text x="110" y="200" font-family="Arial" font-size="12" fill="#4a5568" text-anchor="middle">Edit the main component to update all instances</text>
</svg>